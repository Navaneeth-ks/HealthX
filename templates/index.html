<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HealthX Monitor</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
}

#layout {
    display: grid;
    grid-template-columns: 22% 56% 22%;
    height: 100vh;
}

#left { padding: 12px; }
.plot { height: 44vh; }

#posePanel {
    display: flex;
    align-items: center;
    justify-content: center;
}

#poseBox {
    width: 96%;
    height: 94%;
    background: #000;
    border-radius: 26px;
    box-shadow: inset 0 0 0 2px #000, 0 0 50px rgba(0,0,0,0.9);
    position: relative;
}

#poseCanvas { width: 100%; height: 100%; }

#analysisOverlay {
    position: absolute;
    top: 16px;
    right: 20px;
    background: rgba(0,0,0,0.65);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: monospace;
    font-size: 14px;
    z-index: 5;
}

#aiPanel {
    background: black;
    border-left: 1px solid #222;
}
#aiTitle {
    font-size: 18px;
    font-weight: bold;
    color: #00ff66;           /* HealthX green */
    padding: 14px 14px 6px;
    border-bottom: 1px solid #1a1a1a;
    letter-spacing: 0.5px;
}

#aiContent {
    padding: 14px;
    font-family: monospace;
    font-size: 14px;
    white-space: pre-line;
    color: #d0ffd0;
}
#stopWorkoutBtn {
    position: fixed;
    bottom: 20px;
    right: 24px;
    padding: 12px 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    background: #de4466;
    color: black;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    z-index: 20;
}


</style>
</head>
<button id="stopWorkoutBtn">Stop Workout</button>

<body>

<div id="layout">

<div id="left">
    <h3>ECG</h3>
    <div id="ecgPlot" class="plot"></div>
    <h3>EMG</h3>
    <div id="emgPlot" class="plot"></div>
</div>

<div id="posePanel">
<div id="poseBox">

<div id="analysisOverlay">
    <div id="angleNeck">Neck: --</div>
    <div id="angleElbow">Elbow: --</div>
    <div id="angleBody">Body: --</div>
    <div id="angleKnee">Knee: --</div>
    <hr>
    <div id="repCounter">Reps: 0</div>
</div>

<div id="poseCanvas"></div>
</div>
</div>

<div id="aiPanel">
    <div id="aiTitle">Coach</div>
    <div id="aiContent">AI loading...</div>
</div>


</div>

<script>
/* ================= ECG + EMG ================= */
const sampleRate = 20;
const displayWindowSeconds = 10;
let ecgX=[], ecgY=[], emgX=[], emgY=[], currentSecond=0;

function baseLayout(title, range) {
    return {
        title,
        paper_bgcolor:"black",
        plot_bgcolor:"black",
        xaxis:{range:[0,displayWindowSeconds]},
        yaxis:{range},
        font:{color:"white"}
    };
}

Plotly.newPlot("ecgPlot",[{
    x:ecgX,y:ecgY,mode:"lines",line:{color:"#00ff66"}
}],baseLayout("ECG",[-1.2,1.2]),{displayModeBar:false});

Plotly.newPlot("emgPlot",[{
    x:emgX,y:emgY,mode:"lines",line:{color:"#00aaff"}
}],baseLayout("EMG",[-1.5,1.5]),{displayModeBar:false});

async function updateSignals(){
    const ecg=await fetch("/ecg").then(r=>r.json());
    const emg=await fetch("/emg").then(r=>r.json());
    if(!ecg.ecgValues||!emg.emgValues) return;

    const x=ecg.ecgValues.map((_,i)=>currentSecond+i/sampleRate);
    ecgX.push(...x); ecgY.push(...ecg.ecgValues);
    emgX.push(...x); emgY.push(...emg.emgValues);

    const ws=Math.max(0,currentSecond-displayWindowSeconds+1);
    while(ecgX.length&&ecgX[0]<ws){
        ecgX.shift(); ecgY.shift();
        emgX.shift(); emgY.shift();
    }

    Plotly.update("ecgPlot",{x:[ecgX],y:[ecgY]},{"xaxis.range":[ws,ws+displayWindowSeconds]});
    Plotly.update("emgPlot",{x:[emgX],y:[emgY]},{"xaxis.range":[ws,ws+displayWindowSeconds]});
    currentSecond++;
}
setInterval(updateSignals,1000);

/* ================= MEDIAPIPE 3D ================= */
const container = document.getElementById("poseCanvas");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50,1,0.01,100);
camera.position.set(0,1.2,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
container.appendChild(renderer.domElement);

function resize(){
    const w=container.clientWidth,h=container.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
}
resize(); window.addEventListener("resize",resize);

const skeleton = new THREE.Group();
scene.add(skeleton);

const POSE_CONNECTIONS = [
  [11,13],[13,15],[15,17],[12,14],[14,16],[16,18],
  [11,12],[11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28]
];

let joints=[], bones=[], initialized=false;

/* ================= PUSH-UP ANALYSIS ================= */
let repCount=0,lastElbowAngle=180;

const IDEAL={
  neck:{min:160,max:180,worst:120},
  elbow:{min:80,max:110,worst:160},
  body:{min:165,max:180,worst:140},
  knee:{min:160,max:180,worst:120}
};

let badCounts={neck:0,elbow:0,body:0,knee:0};

function angleBetween(a,b,c){
    const ab=new THREE.Vector3().subVectors(a,b);
    const cb=new THREE.Vector3().subVectors(c,b);
    return Math.acos(ab.dot(cb)/(ab.length()*cb.length()))*(180/Math.PI);
}

function angleState(v, ideal){
    // Inside ideal range → GOOD
    if (v >= ideal.min && v <= ideal.max) {
        return "good";
    }

    // Distance from nearest ideal bound
    const deviation = Math.min(
        Math.abs(v - ideal.min),
        Math.abs(v - ideal.max)
    );

    const maxDeviation = Math.abs(ideal.worst - ideal.min);
    const severity = deviation / maxDeviation;

    /*
      Severity scale (VERY tolerant):
      0.0 – 0.75 → still GOOD (normal human variance)
      0.75 – 0.9 → WARN (clear form degradation)
      0.9 – 1.0 → BAD  (danger / collapse)
    */

    if (severity < 0.75) {
        return "good";
    }

    if (severity < 0.9) {
        return "warn";
    }

    return "bad";
}



function initSkeleton(data){
    data.forEach(()=>{
        const j=new THREE.Mesh(
            new THREE.SphereGeometry(0.04),
            new THREE.MeshBasicMaterial({color:0xffffff})
        );
        skeleton.add(j); joints.push(j);
    });
    POSE_CONNECTIONS.forEach(()=>{
        const g=new THREE.BufferGeometry();
        g.setAttribute("position",new THREE.Float32BufferAttribute([0,0,0,0,0,0],3));
        const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x00ff66}));
        skeleton.add(l); bones.push(l);
    });
}

function updateSkeleton(data){
    const sL=data[11],sR=data[12];
    const cx=(sL.x+sR.x)/2;
    const cy=(sL.y+sR.y)/2+1;
    const cz=(sL.z+sR.z)/2;

    data.forEach((p,i)=>{
        joints[i].position.set((p.x-cx)*2,-(p.y-cy)*2,-(p.z-cz)*2);
    });

    bones.forEach((b,i)=>{
        const[a,c]=POSE_CONNECTIONS[i];
        b.geometry.attributes.position.array.set([
            joints[a].position.x,joints[a].position.y,joints[a].position.z,
            joints[c].position.x,joints[c].position.y,joints[c].position.z
        ]);
        b.geometry.attributes.position.needsUpdate=true;
    });

    const A=joints;
    const ang={
        neck:angleBetween(A[11].position,A[0].position,A[12].position),
        elbow:angleBetween(A[11].position,A[13].position,A[15].position),
        body:angleBetween(A[11].position,A[23].position,A[27].position),
        knee:angleBetween(A[23].position,A[25].position,A[27].position)
    };

    const states={
        neck:angleState(ang.neck,IDEAL.neck),
        elbow:angleState(ang.elbow,IDEAL.elbow),
        body:angleState(ang.body,IDEAL.body),
        knee:angleState(ang.knee,IDEAL.knee)
    };

    for(const k in states) if(states[k]==="bad") badCounts[k]++;

    if(lastElbowAngle>100&&ang.elbow<100) repCount++;
    lastElbowAngle=ang.elbow;

    function color(state){
    if (state === "good") return "rgb(0,255,0)";        // green
    if (state === "warn") return "rgb(255,180,0)";      // soft amber
    return "rgb(255,60,60)";                            // red (rare)
}


    angleNeck.innerHTML=`Neck: <span style="color:${color(states.neck)}">${ang.neck.toFixed(1)}°</span>`;
    angleElbow.innerHTML=`Elbow: <span style="color:${color(states.elbow)}">${ang.elbow.toFixed(1)}°</span>`;
    angleBody.innerHTML=`Body: <span style="color:${color(states.body)}">${ang.body.toFixed(1)}°</span>`;
    angleKnee.innerHTML=`Knee: <span style="color:${color(states.knee)}">${ang.knee.toFixed(1)}°</span>`;
    repCounter.innerHTML=`Reps: ${repCount}`;

    sendResponseData({
        reps:repCount,
        angles:ang,
        angle_status:states,
        bad_counts:badCounts,
        ecg:{mean:ecgY.reduce((a,b)=>a+b,0)/Math.max(ecgY.length,1),peak:Math.max(...ecgY,0)},
        emg:{mean:emgY.reduce((a,b)=>a+b,0)/Math.max(emgY.length,1),peak:Math.max(...emgY,0)}
    });
}

const socket=io({transports:["websocket"],upgrade:false});
socket.on("pose",d=>{if(!initialized){initSkeleton(d);initialized=true;}updateSkeleton(d);});

(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);})();

let lastWrite=0;
function sendResponseData(p){
    const n=performance.now();
    if(n-lastWrite<500) return;
    lastWrite=n;
    fetch("/update_response_data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
}

/* ================= AI PANEL ================= */

function updateAIResponse(){
    fetch("/ai_feedback")
        .then(r => r.json())
        .then(d => {
            // backend returns { text: "..." }
            if (!d || !d.text) return;

            document.getElementById("aiContent").innerText = d.text;
        })
        .catch(err => {
            console.error("AI fetch failed:", err);
        });
}

setInterval(updateAIResponse, 10000);
updateAIResponse();
let workoutStopped = false;

document.getElementById("stopWorkoutBtn").onclick = () => {
    workoutStopped = true;

    // tell backend workout ended
    fetch("/stop_workout", { method: "POST" }).catch(()=>{});

    // stop UI updates
    clearInterval(updateSignals);
    
    // go to loading screen
    window.location.href = "/loading";
};

</script>



</body>
</html>
