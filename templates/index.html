<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live Signal Monitor</title>

<!-- Console / terminal font -->
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- Plotly -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
/* ===========================
   🎛 COLOR CONFIGURATION
   =========================== */
:root {
    --bg-main: #000000;
    --bg-plot: #000000;
    --text-main: #ffffff;
    --ecg-line: #00ff66;
    --emg-line: #00aaff;
    --grid-major: #003300;
}

/* ===========================
   Global Styling
   =========================== */
body {
    margin: 0;
    background-color: var(--bg-main);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-main);
}

#header {
    text-align: center;
    padding: 12px;
    font-size: 22px;
    letter-spacing: 2px;
}

#plot {
    width: 100vw;
    height: 90vh;
}
</style>
</head>

<body>

<div id="header">INITIALISING…</div>
<div id="plot"></div>

<script>
/* ===========================
   Configuration
   =========================== */
const sampleRate = 20;
const displayWindowSeconds = 10;

let xData = [];
let yData = [];
let currentSecond = 0;

let mode = null;       // "ecg" or "emg"
let endpoint = null;
let lineColor = null;

/* ===========================
   Detect Mode
   =========================== */
async function detectMode() {
    try {
        const res = await fetch("/emg");
        const data = await res.json();
        if (data.emgValues) {
            mode = "emg";
            endpoint = "/emg";
            lineColor = getComputedStyle(document.documentElement)
                .getPropertyValue('--emg-line');
            document.getElementById("header").innerText = "LIVE EMG MONITOR";
            return;
        }
    } catch {}

    // Fallback to ECG
    mode = "ecg";
    endpoint = "/ecg";
    lineColor = getComputedStyle(document.documentElement)
        .getPropertyValue('--ecg-line');
    document.getElementById("header").innerText = "LIVE ECG MONITOR";
}

/* ===========================
   Plot Layout
   =========================== */
const layout = {
    paper_bgcolor: "black",
    plot_bgcolor: "black",
    xaxis: {
        title: "Time (seconds)",
        color: "white",
        gridcolor: "#003300",
        range: [0, displayWindowSeconds]
    },
    yaxis: {
        title: "Amplitude",
        color: "white",
        gridcolor: "#003300",
        range: [-1.2, 1.2]
    },
    font: {
        family: "Share Tech Mono",
        color: "white"
    }
};

/* ===========================
   Initialize Plot
   =========================== */
Plotly.newPlot("plot", [{
    x: xData,
    y: yData,
    mode: "lines",
    line: { color: "#ffffff", width: 2 }
}], layout, { displayModeBar: false });

/* ===========================
   Update Loop
   =========================== */
async function updateSignal() {
    if (!endpoint) return;

    try {
        const response = await fetch(endpoint);
        const data = await response.json();

        const values =
            mode === "ecg" ? data.ecgValues :
            mode === "emg" ? data.emgValues :
            [];

        if (!values || values.length === 0) return;

        const xValues = values.map((_, i) =>
            currentSecond + i / sampleRate
        );

        xData.push(...xValues);
        yData.push(...values);

        const windowStart = Math.max(
            0,
            currentSecond - displayWindowSeconds + 1
        );
        const windowEnd = windowStart + displayWindowSeconds;

        while (xData.length && xData[0] < windowStart) {
            xData.shift();
            yData.shift();
        }

        Plotly.update("plot", {
            x: [xData],
            y: [yData],
            line: [{ color: lineColor }]
        }, {
            "xaxis.range": [windowStart, windowEnd]
        });

        currentSecond += 1;

    } catch (err) {
        console.error("Signal fetch failed");
    }
}

/* ===========================
   Startup
   =========================== */
(async () => {
    await detectMode();
    setInterval(updateSignal, 1000);
})();
</script>

</body>
</html>
