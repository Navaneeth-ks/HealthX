<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live ECG & EMG Monitor</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
:root {
    --bg-main: #000000;
    --bg-plot: #000000;
    --text-main: #ffffff;
    --ecg-line: #00ff66;
    --emg-line: #00aaff;
    --grid-major: #003300;
}

body {
    margin: 0;
    background-color: var(--bg-main);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-main);
}

#header {
    text-align: center;
    padding: 12px;
    font-size: 22px;
    letter-spacing: 2px;
}

.plot {
    width: 100vw;
    height: 45vh;
}
</style>
</head>

<body>

<div id="header">LIVE ECG & EMG MONITOR</div>

<div id="ecgPlot" class="plot"></div>
<div id="emgPlot" class="plot"></div>

<script>
const sampleRate = 20;
const displayWindowSeconds = 10;

let ecgX = [], ecgY = [];
let emgX = [], emgY = [];
let currentSecond = 0;

/* ===========================
   Layouts
   =========================== */
function baseLayout(title, yRange) {
    return {
        title: title,
        paper_bgcolor: "black",
        plot_bgcolor: "black",
        xaxis: {
            title: "Time (seconds)",
            color: "white",
            gridcolor: "#003300",
            range: [0, displayWindowSeconds]
        },
        yaxis: {
            title: "Amplitude",
            color: "white",
            gridcolor: "#003300",
            range: yRange
        },
        font: {
            family: "Share Tech Mono",
            color: "white"
        },
        margin: { t: 40 }
    };
}

/* ===========================
   Initialize Plots
   =========================== */
Plotly.newPlot("ecgPlot", [{
    x: ecgX,
    y: ecgY,
    mode: "lines",
    line: { color: "#00ff66", width: 2 }
}], baseLayout("ECG", [-1.2, 1.2]), { displayModeBar: false });

Plotly.newPlot("emgPlot", [{
    x: emgX,
    y: emgY,
    mode: "lines",
    line: { color: "#00aaff", width: 2 }
}], baseLayout("EMG", [-1.5, 1.5]), { displayModeBar: false });

/* ===========================
   Update Loop
   =========================== */
async function updateSignals() {
    try {
        const ecgRes = await fetch("/ecg");
        const emgRes = await fetch("/emg");

        const ecgData = await ecgRes.json();
        const emgData = await emgRes.json();

        if (!ecgData.ecgValues || !emgData.emgValues) return;

        const xValues = ecgData.ecgValues.map((_, i) =>
            currentSecond + i / sampleRate
        );

        ecgX.push(...xValues);
        ecgY.push(...ecgData.ecgValues);

        emgX.push(...xValues);
        emgY.push(...emgData.emgValues);

        const windowStart = Math.max(
            0,
            currentSecond - displayWindowSeconds + 1
        );
        const windowEnd = windowStart + displayWindowSeconds;

        while (ecgX.length && ecgX[0] < windowStart) {
            ecgX.shift();
            ecgY.shift();
            emgX.shift();
            emgY.shift();
        }

        Plotly.update("ecgPlot", {
            x: [ecgX],
            y: [ecgY]
        }, { "xaxis.range": [windowStart, windowEnd] });

        Plotly.update("emgPlot", {
            x: [emgX],
            y: [emgY]
        }, { "xaxis.range": [windowStart, windowEnd] });

        currentSecond += 1;

    } catch (err) {
        console.error("Signal fetch failed");
    }
}

setInterval(updateSignals, 1000);
</script>

</body>
</html>
