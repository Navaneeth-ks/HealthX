<!DOCTYPE html>
<html>
<head>
  <title>Real-Time 3D Pose</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>


<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 0, 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const socket = io("http://localhost:5000");

const POSE_CONNECTIONS = [
  [11,13],[13,15],
  [12,14],[14,16],
  [11,12],
  [11,23],[12,24],
  [23,24],
  [23,25],[25,27],
  [24,26],[26,28],
  [27,31],[28,32],
  [15,17],[15,19],
  [16,18],[16,20]
];

let joints = [];
let bones = [];
const SMOOTHING = 0.6; // higher = smoother

// Create joints
function initSkeleton(data) {
  data.forEach(() => {
    const joint = new THREE.Mesh(
      new THREE.SphereGeometry(0.015),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    scene.add(joint);
    joints.push(joint);
  });

  POSE_CONNECTIONS.forEach(() => {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute([0,0,0, 0,0,0], 3)
    );
    const line = new THREE.Line(
      geometry,
      new THREE.LineBasicMaterial({ color: 0x00ff00 })
    );
    scene.add(line);
    bones.push(line);
  });
}

// Update joints & bones
function updateSkeleton(data) {
  data.forEach((p, i) => {
    joints[i].position.lerp(
      new THREE.Vector3(p.x, -p.y, -p.z),
      1 - SMOOTHING
    );
  });

  bones.forEach((bone, i) => {
    const [a, b] = POSE_CONNECTIONS[i];
    const pos = bone.geometry.attributes.position.array;

    pos[0] = joints[a].position.x;
    pos[1] = joints[a].position.y;
    pos[2] = joints[a].position.z;

    pos[3] = joints[b].position.x;
    pos[4] = joints[b].position.y;
    pos[5] = joints[b].position.z;

    bone.geometry.attributes.position.needsUpdate = true;
  });
}

socket.on("pose_data", data => {
  if (joints.length === 0) {
    initSkeleton(data);
  }
  updateSkeleton(data);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>




</body>
</html>
